<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talking points</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 20'%3E%3Cg fill='%2300bceb'%3E%3Crect x='1' y='14' width='2' height='5' rx='1'/%3E%3Crect x='5' y='9' width='2' height='10' rx='1'/%3E%3Crect x='9' y='3' width='2' height='16' rx='1'/%3E%3Crect x='13' y='9' width='2' height='10' rx='1'/%3E%3Crect x='17' y='14' width='2' height='5' rx='1'/%3E%3Crect x='21' y='9' width='2' height='10' rx='1'/%3E%3Crect x='25' y='3' width='2' height='16' rx='1'/%3E%3Crect x='29' y='9' width='2' height='10' rx='1'/%3E%3Crect x='33' y='14' width='2' height='5' rx='1'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body data-mode="points">
  <div id="points-root" hidden>
    <header class="pt-top">
      <div class="pt-brand">
        <svg class="mark" viewBox="0 0 36 20" aria-hidden="true"><g fill="currentColor"><rect x="1" y="14" width="2" height="5" rx="1"/><rect x="5" y="9" width="2" height="10" rx="1"/><rect x="9" y="3" width="2" height="16" rx="1"/><rect x="13" y="9" width="2" height="10" rx="1"/><rect x="17" y="14" width="2" height="5" rx="1"/><rect x="21" y="9" width="2" height="10" rx="1"/><rect x="25" y="3" width="2" height="16" rx="1"/><rect x="29" y="9" width="2" height="10" rx="1"/><rect x="33" y="14" width="2" height="5" rx="1"/></g></svg>
        <span>Talking points</span><span id="pt-sync" class="pt-sync"></span>
      </div>
      <div class="pt-clock"><span id="pt-clock"></span><span id="pt-pace" class="pt-pace"></span><button id="pt-clock-reset" title="Restart the clock">Restart clock</button></div>
    </header>
    <div class="pt-body">
      <main class="pt-main">
        <div class="eyebrow" id="pt-eyebrow"></div>
        <h1 id="pt-title"></h1>
        <ul id="pt-now"></ul>
        <p id="pt-say"></p>
        <p id="pt-next"></p>
      </main>
      <nav id="pt-outline" aria-label="Scenes"></nav>
    </div>
    <footer class="pt-foot">
      <button id="pt-prev">← Back</button><button id="pt-nextbtn" class="primary">Next →</button>
      <span class="pt-gap"></span>
      <button id="pt-script" title="S">Full script</button><button id="pt-smaller" title="-">A−</button><button id="pt-bigger" title="+">A+</button>
      <span class="pt-keys">→ next · ← back · ↓ ↑ scene · S script · + − size</span>
    </footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
